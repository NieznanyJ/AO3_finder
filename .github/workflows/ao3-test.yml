name: AO3 test przeglądarki

# Jednorazowy test: czy AO3 (Cloudflare) wpuszcza Chrome'a z serwerów GitHuba.
# Bez sekretów i bez bazy — jedno zapytanie do AO3, wynik w logu.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright beautifulsoup4
      - name: Skąd wychodzi ruch
        run: curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|colo|loc)="
      - name: Chrome z oknem na wirtualnym ekranie
        run: |
          xvfb-run -a python - <<'EOF'
          import sys
          sys.path.insert(0, "scraper")
          from playwright.sync_api import sync_playwright
          from ao3 import build_search_url, parse_search_page

          url = build_search_url({"query": "draco malfoy/Hermiona Granger", "language_id": "pl"})
          with sync_playwright() as p:
              for headless in (False, True):
                  browser = p.chromium.launch(channel="chrome", headless=headless)
                  page = browser.new_page()
                  resp = page.goto(url, wait_until="domcontentloaded", timeout=120_000)
                  page.wait_for_timeout(8000)  # czas na ewentualne sprawdzenie Cloudflare
                  r = parse_search_page(page.content())
                  print(f"headless={headless}: HTTP {resp.status} | {page.title()[:70]} | fików: {len(r['works'])}")
                  browser.close()
          EOF
